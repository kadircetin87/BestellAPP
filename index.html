<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BurgerHouse | BestellApp</title>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="scripts/db.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body onload="init()">
    <header>
      <div class="header-inner">
        <img class="header-icon" src="assets/icons/takeout-bag-icon.png" alt="" />
        <img class="wordmark" src="assets/icons/bestell-app-wordmark.png" alt="BestellApp" />
      </div>
    </header>
    <div class="hero">
      <img class="cover" src="assets/img/cover.jpg" alt="" />
      <img class="restaurant-logo" src="assets/icons/burger-house-logo.png" alt="" />
    </div>
    <main>
      <div class="restaurant-name">
        <h1>BurgerHouse</h1>
        <img src="assets/icons/restaurant-rating-badge.png" alt="Rated 4.1 out of 5 from 317 reviews" />
      </div>
      <p class="intro">
        The best of Burgers, Pizza, and Greens, all in one great place.
      </p>
      <div class="content">
        <section class="menu">
          <h2 class="category-title">
            <img src="assets/icons/burger-category-icon.png" alt="" />
            Burger<span class="category-note"> &amp; Sandwiches</span>
          </h2>
          <div id="burger-list"></div>
          <h2 class="category-title">
            <img src="assets/icons/pizza-category-icon.png" alt="" />
            Pizza <small>(30cm)</small>
          </h2>
          <div id="pizza-list"></div>
          <h2 class="category-title">
            <img src="assets/icons/salad-category-icon.png" alt="" />
            Salad
          </h2>
          <div id="salad-list"></div>
        </section>
        <section class="basket" id="basket">
          <h2>Your Basket</h2>
          <div id="basket-list"></div>
          <div id="basket-total"></div>
          <button id="buy" onclick="placeOrder()" hidden>Buy now</button>
        </section>
      </div>
    </main>
    <footer>
      <div class="footer-inner">© 2025 BurgerHouse · Imprint · Cookie Preferences</div>
    </footer>
    <div class="mobile-basket-bar">
      <a class="bar-icon" href="#" aria-label="Home"><img src="assets/icons/Home.png" alt="" /></a>
      <span class="bar-icon"><img src="assets/icons/Profile.png" alt="" /></span>
      <span class="bar-icon"><img src="assets/icons/orders.png" alt="" /></span>
      <button id="basket-toggle" onclick="openBasket()" aria-haspopup="dialog">
        <span class="bar-icon">
          <img src="assets/icons/shopping_cart-neu.png" alt="Basket" />
          <span id="basket-count">0</span>
        </span>
      </button>
    </div>
    <dialog id="basket-dialog" aria-label="Your basket" onclose="restoreBasket()">
      <button aria-label="Close basket" onclick="this.parentElement.close()">×</button>
    </dialog>
    <div id="order-toast" class="order-toast" role="alertdialog" aria-modal="true" aria-labelledby="order-toast-title" hidden>
      <div class="order-toast-box">
        <img src="assets/icons/order-confirmed-icon.png" alt="" />
        <h2 id="order-toast-title">Order confirmed!</h2>
        <p>Your food is on the way!</p>
        <button id="order-toast-close" aria-label="Close message" onclick="hideOrderToast()">×</button>
      </div>
    </div>
  </body>
</html>
