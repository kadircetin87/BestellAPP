<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BurgerHouse | BestellApp</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="scripts/db.js"></script>
</head>
<body>
  <header>BestellApp</header>
  <main>
    <img class="cover" src="assets/img/cover-web.jpg" alt="">
    <h1>BurgerHouse</h1>
    <p class="intro">The best of Burgers, Pizza, and Greens, all in one great place.</p>
    <section>
      <h2>Menu</h2>
      <article class="meal-card">
        <img src="assets/img/veggie-web.jpg" alt="Veggie burger in a black bun">
        <div>
          <h3>Veggie mushroom black burger</h3>
          <p>Mixed green salad, tomatoes, edamame and mushrooms.</p>
          <strong>16,90 €</strong>
        </div>
      </article>
      <article class="meal-card">
        <img src="assets/img/chorizo-web.jpg" alt="Pizza topped with chorizo">
        <div>
          <h3>Pizza Chorizo</h3>
          <p>Tomato slices, mozzarella and chorizo.</p>
          <strong>13,90 €</strong>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
